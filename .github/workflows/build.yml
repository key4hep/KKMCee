name: 'Build and Test'

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        OS: ['key4hep/key4hep-images/alma9',
             'key4hep/key4hep-images/alma10',
             'key4hep/key4hep-images/ubuntu24',
             'key4hep/key4hep-images/ubuntu26']
        SW: ['/cvmfs/sw.hsf.org/key4hep/setup.sh',
             '/cvmfs/sw-nightlies.hsf.org/key4hep/setup.sh']
        DZ: ['dizet-6.21', 'dizet-6.42', 'dizet-6.45']
    steps:
    - uses: actions/checkout@v7
    - uses: cvmfs-contrib/github-action-cvmfs@v5
    - name: Start the container
      run: |
        docker run -it --name CI_container \
          -v ${GITHUB_WORKSPACE}:/home/Package \
          -v /cvmfs:/cvmfs:shared \
          -d ghcr.io/${{ matrix.OS }}:latest /bin/bash
    - name: Configure and build
      run: |
        docker exec CI_container /bin/bash -c 'cd /home/Package && \
          source ${{ matrix.SW }} ; if [ $? != 0 ] ; then exit 0 ; fi ; \
          ln -f -s ${{ matrix.DZ }} dizet && \
          autoreconf -f -i -Wno-obsolete && \
          ./configure && \
          make'
    - name: Test
      run: |
        docker exec CI_container /bin/bash -c 'cd /home/Package && \
          source ${{ matrix.SW }} ; if [ $? != 0 ] ; then exit 0 ; fi ; \
          echo "To Be Done ..."'
